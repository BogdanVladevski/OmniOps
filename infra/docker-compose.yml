services:
  postgres:
    image: postgres:16-alpine
    container_name: omniops-db
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-OmniOps}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-OmniOps}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: omniops-api:local
    container_name: omniops-api
    ports:
      - "5031:8080"
    env_file:
      - ../.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-OmniOps};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123}
      JWT_REQUIRE_AUTHENTICATION: "false"
      STORAGE_ROOT_PATH: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  uploads:
