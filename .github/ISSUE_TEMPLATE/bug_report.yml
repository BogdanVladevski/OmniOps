name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: dropdown
    id: side
    attributes:
      label: Where
      options: [Office app, Driver app, Customer tracking or invoice page, API, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: input
    id: environment
    attributes:
      label: Device, browser or OS
