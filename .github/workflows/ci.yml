name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore OmniOps.slnx

      - name: Build (warnings are errors)
        run: dotnet build OmniOps.slnx --configuration Release --no-restore

      - name: API contract is up to date
        run: |
          git diff --exit-code -- docs/api \
            || { echo "::error::docs/api/omniops-api.json is out of date. Build OmniOps.Api and commit it."; exit 1; }

      - name: Unit tests
        run: dotnet test --project tests/OmniOps.UnitTests --configuration Release --no-build

      - name: Integration tests
        run: dotnet test --project tests/OmniOps.IntegrationTests --configuration Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: API client matches the contract
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::src/api/schema.d.ts is out of date. Run npm run api:types and commit it."; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Tests
        run: npm test -- --ci
